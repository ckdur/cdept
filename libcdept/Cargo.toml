[package]
name = "libcdept"
description = "CDePT core: project/library model, technology, tool adapters (no GUI)"
version.workspace = true
license.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# `libcdept::testutil`: the environment guards of the tests (see docs/TESTS.md).
testutil = []

[dependencies]
cdept-uberwave.workspace = true
eyre.workspace = true
serde.workspace = true
memmap2.workspace = true
memchr = "2"
quick-xml.workspace = true
miniz_oxide.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
tracing.workspace = true
toml.workspace = true
notify = "9"
chrono.workspace = true
libloading = "0.8"
rusqlite = { version = "0.43.0", features = ["bundled"] }
# The parent-death signal of job processes (libcdept::orphan). MIT or Apache-2.0.
libc = "0.2"
# CACE datasheets (YAML): libcdept::cace.
serde_yaml_ng = "0.10"
# Digital waveforms (VCD, FST, GHW): libcdept::raw::digital. BSD-3-Clause.
wellen = { version = "0.25", default-features = false }

[dev-dependencies]
tempfile.workspace = true
image.workspace = true
libcdept = { path = ".", features = ["testutil"] }

[build-dependencies]
vergen-gitcl = { version = "1.0.0", features = ["build"] }
