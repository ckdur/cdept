name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Only xschem: KLayout (cdept-klayout/klayout) is built in the job `klayout`; here
      # the tests that need it skip themselves.
      - run: git submodule update --init cdept-xschem/xschem
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries for eframe (X11/Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev
      - name: Build tools and libraries for the xschem helper
        run: sudo apt-get install -y flex bison tcl-dev libcairo2-dev libjpeg-dev fonts-dejavu-core
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Install (scripts/install.sh) and run from the installed layout
        run: |
          scripts/install.sh --prefix "$RUNNER_TEMP/prefix"
          cp -r examples/buffer "$RUNNER_TEMP/buffer"
          cd "$RUNNER_TEMP/buffer"
          env -u CDEPT_XSCHEM -u CDEPT_XSCHEM_SHAREDIR "$RUNNER_TEMP/prefix/bin/cdept" xschem version
          env -u CDEPT_XSCHEM -u CDEPT_XSCHEM_SHAREDIR "$RUNNER_TEMP/prefix/bin/cdept" netlist logic buf -o buf.spice
          grep -q '^x1 ' buf.spice
          if [ -f "$GITHUB_WORKSPACE/cdept-klayout/helper/cdept_klayout/main.py" ]; then
            test -f "$RUNNER_TEMP/prefix/share/cdept-klayout/cdept_klayout/main.py"
          fi

  # KLayout built from the submodule (cached: the build takes about an hour on a
  # runner), then the helper's protocol tests and the Rust tests that start it.
  klayout:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init cdept-xschem/xschem cdept-klayout/klayout
      - name: KLayout commit
        id: klayout
        run: echo "commit=$(git rev-parse HEAD:cdept-klayout/klayout)" >> "$GITHUB_OUTPUT"
      - name: Build tools and libraries for KLayout
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt5-qmake qtbase5-dev qttools5-dev \
            libqt5svg5-dev libqt5xmlpatterns5-dev qtmultimedia5-dev python3-dev ruby-dev \
            zlib1g-dev libgit2-dev
      - name: Build tools and libraries for the xschem helper
        run: sudo apt-get install -y flex bison tcl-dev libcairo2-dev libjpeg-dev fonts-dejavu-core
      - name: Cached KLayout build
        id: cache
        uses: actions/cache@v4
        with:
          path: cdept-klayout/.bin
          key: klayout-${{ runner.os }}-${{ steps.klayout.outputs.commit }}-${{ hashFiles('cdept-klayout/build.sh') }}
      - name: Build KLayout
        if: steps.cache.outputs.cache-hit != 'true'
        run: cdept-klayout/build.sh
      - run: cdept-klayout/.bin/klayout -v
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/cdept-klayout/.bin
          QT_QPA_PLATFORM: offscreen
      - name: Helper protocol tests
        run: cdept-klayout/tests/run.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # DRC/LVS (tests/verify.rs) and the IHP linking test skip themselves: there is no
      # PDK on the runner.
      - name: Rust tests that start KLayout
        run: cargo test -p libcdept --test klayout --test verify --test link --test oasis

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Only xschem: KLayout (cdept-klayout/klayout) is large and not built in CI; tests
      # that need it skip themselves.
      - run: git submodule update --init cdept-xschem/xschem
      - uses: dtolnay/rust-toolchain@1.95
      - name: System libraries for eframe (X11/Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev
      - name: Build tools and libraries for the xschem helper
        run: sudo apt-get install -y flex bison tcl-dev libcairo2-dev libjpeg-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
