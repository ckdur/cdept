[workspace]
resolver = "3"
members = ["cdept", "cdept-gui", "libcdept"]

[workspace.package]
version = "0.1.0"
license = "MIT"
categories = []
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/ckdur/cdept"

[workspace.dependencies]
libcdept = { path = "libcdept" }
cdept-gui = { path = "cdept-gui" }

eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.33", default-features = false, features = ["serde"] }
egui_dock = { version = "0.18", features = ["serde"] }

chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
eyre = "0.6.12"
serde = { version = "1", features = ["derive"] }
ron = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
