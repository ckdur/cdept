[workspace]
resolver = "3"
members = ["amt", "libamt"]

[workspace.package]
version = "0.1.0"
license = "MIT"
categories = []
edition = "2024"
rust-version = "1.88"
repository = "https://gitlab.com/ckdur/amt/"

[workspace.dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.33", default-features = false, features = ["serde"] }
eyre = "0.6.12"
lazy_static = "1.5.0"
