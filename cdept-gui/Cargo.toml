[package]
name = "cdept-gui"
description = "CDePT egui frontend: docked main window and views"
version.workspace = true
license.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
libcdept.workspace = true
cdept-wavedata.workspace = true
# the desktop's clipboard and primary selection for xschem (egui reads only what is
# pasted); the same crate egui-winit uses, so nothing new is built
arboard = { version = "3.6", default-features = false }
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
# Axes, grid and navigation of the waveform tabs (MIT OR Apache-2.0); the data is the
# engine's (cdept-wavedata).
egui_plot = "0.37"
eyre.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
ron.workspace = true
libcdept = { workspace = true, features = ["testutil"] }
tempfile.workspace = true
