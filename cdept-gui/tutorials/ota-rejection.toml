    'setup:work/tb_ota5t/psrr:variables.ac_dm~"0"',
    'setup:work/tb_ota5t/psrr:variables.ac_cm~"0"',
]
needs_hint = "Only ac_vdd is 1; then Save."

[[step]]
id = "psrr-run"
title = "Run"
text = """
Press "Run".
"""
point = [
    { at = "sim.run", say = 'Click "Run"' },
]
done_when = ["sim.ran:work/tb_ota5t/psrr"]

[[step]]
id = "psrr-read"
title = "PSRR"
text = """
- xfer_db -30.9 dB: supply ripple arrives at out 35 times smaller (psrr_db is the same
  number with the sign turned).
- rejection_db 66.1 dB: referred to the input, supply ripple acts like a signal 2000
  times smaller.

Both numbers are called PSRR in places. Say which one you mean.
"""
point = [
    { at = "sim.results", say = "The results" },
    { at = "sim.setup", say = "Fold Setup" },
]
continue_button = true

