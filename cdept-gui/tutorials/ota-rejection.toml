schema = "cdept-tutorial"
version = 1
id = "ota-rejection"
title = "OTA 6: supply and common-mode rejection, and power"
series = "ota"
order = 6
start = ["base", "ota-sch", "ota-sym", "ota-tb", "ota-dc", "ota-ac", "ota-step"]
pdk = "ihp-sg13g2"
goal = """
You measure how much of the supply's and the input common mode's disturbance reaches
the output (PSRR, CMRR), find where the common-mode gain comes from, and measure the
power.
"""
minutes = 25
before = """
- [OTA 3](ota-ac.md) and [OTA 4](ota-step.md).
"""

[[step]]
id = "start"
title = "Get the project"
text = """
Make the starting project.
"""
start_button = true
continue_button = true
continue_needs = [
    "view:work/tb_ota5t/ac_response",
]
needs_hint = "Open a project that has work/tb_ota5t/ac_response."

[[step]]
id = "idea"
title = "Two more AC measurements"
text = """
The same open-loop testbench, with the AC source somewhere else:

- PSRR: 1 V AC on the supply (ac_vdd = 1), no input signal.
- CMRR: 1 V AC on the common-mode source Vcm (ac_cm = 1), which moves both inputs
  together.

The template psrr_cmrr reads out over the stimulated node at 1 kHz (xfer_db). Given
the differential gain adm_db (35.2 dB, from OTA 3), the rejection is adm_db -
xfer_db: how much smaller a disturbance acts than a signal at the input.
"""
picture = "ota-tb-open"
continue_button = true

[[step]]
id = "psrr-select"
title = "Select tb_ota5t"
text = """
In the Libraries panel, click the cell "tb_ota5t".
"""
point = [
    { at = "tree:work/tb_ota5t", say = "Click tb_ota5t" },
    { at = "tree:work", say = "Open work" },
]
done_when = ["selected:work/tb_ota5t", "view:work/tb_ota5t/psrr"]

[[step]]
id = "psrr-new"
title = "New testbench: psrr"
text = """
Open Tools > New Testbench….
"""
point = [
    { at = "menu.tools.new_testbench", say = 'Click "New Testbench…"' },
    { at = "menu.tools", say = "Open the Tools menu" },
]
done_when = ["dialog.new_testbench", "view:work/tb_ota5t/psrr"]

[[step]]
id = "psrr-template"
title = "The template psrr_cmrr"
text = """
Choose psrr_cmrr.
