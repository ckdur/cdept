point = [
    { at = "dialog.new_testbench.template.psrr_cmrr", say = "Choose psrr_cmrr" },
    { at = "dialog.new_testbench.template", say = "Open the Template list" },
]
done_when = ["dialog.new_testbench.template.psrr_cmrr", "view:work/tb_ota5t/psrr"]
lost_without = ["dialog.new_testbench"]
back_to = "psrr-new"
lost_says = "The New Testbench window was closed. Open it again."

[[step]]
id = "psrr-create"
title = "Fill in, then Create"
text = """
Change the view name to

    psrr

Leave mode at psrr and set adm_db = 35.2 and rejection_min = 50. Press "Create".
"""
point = [
    { at = "dialog.new_testbench.view", say = "Name the view psrr; set adm_db and rejection_min" },
]
done_when = ["view:work/tb_ota5t/psrr"]
lost_without = ["dialog.new_testbench"]
back_to = "psrr-new"
lost_says = "The New Testbench window was closed. Open it again."

[[step]]
id = "psrr-vars"
title = "Stimulus on the supply"
