schema = "cdept-tutorial"
version = 1
id = "ota-schematic"
title = "OTA 1: draw the five-transistor OTA"
series = "ota"
order = 1
start = ["base", "ota-lib"]
pdk = "ihp-sg13g2"
goal = """
You draw a five-transistor operational transconductance amplifier (OTA) in IHP
SG13G2, understand what each pair of transistors does, and make its symbol. The other
OTA tutorials analyse this circuit.
"""
minutes = 30
before = """
- The schematic skills of [Inverter 2](inv-schematic.md): placing, sizing, pins,
  wires. They are not explained again here.
- CDePT built with the xschem helper (`cargo build -p cdept-xschem`).
"""

[[circuit]]
id = "bias"
view = "work/ota5t/schematic"
[[circuit.part]]
what = "M5, the tail current source"
symbol = "sg13_lv_pmos"
with = { w = "32u", l = "1u", ng = "4", m = "1" }
pins = { D = "?tail", G = "ibias", S = "vdd", B = "vdd" }
[[circuit.part]]
what = "M6, the diode that sets the bias"
symbol = "sg13_lv_pmos"
with = { w = "32u", l = "1u", ng = "4", m = "1" }
pins = { D = "ibias", G = "ibias", S = "vdd", B = "vdd" }
[[circuit.part]]
what = "the supply pin vdd"
symbol = "iopin"
with = { lab = "vdd" }
[[circuit.part]]
what = "the bias input pin ibias"
symbol = "ipin"
with = { lab = "ibias" }

[[circuit]]
id = "pair"
view = "work/ota5t/schematic"
[[circuit.part]]
what = "M5, the tail current source"
symbol = "sg13_lv_pmos"
with = { w = "32u", l = "1u", ng = "4" }
pins = { D = "?tail", G = "ibias", S = "vdd", B = "vdd" }
[[circuit.part]]
what = "M6, the diode that sets the bias"
symbol = "sg13_lv_pmos"
with = { w = "32u", l = "1u", ng = "4" }
pins = { D = "ibias", G = "ibias", S = "vdd", B = "vdd" }
[[circuit.part]]
what = "M1, the input transistor on inp"
symbol = "sg13_lv_pmos"
with = { w = "30u", l = "0.5u", ng = "4", m = "1" }
pins = { G = "inp", S = "?tail", B = "?tail", D = "?mirror" }
[[circuit.part]]
what = "M2, the input transistor on inn"
symbol = "sg13_lv_pmos"
with = { w = "30u", l = "0.5u", ng = "4", m = "1" }
pins = { G = "inn", S = "?tail", B = "?tail", D = "out" }
[[circuit.part]]
what = "the input pin inp"
symbol = "ipin"
with = { lab = "inp" }
[[circuit.part]]
what = "the input pin inn"
symbol = "ipin"
with = { lab = "inn" }
[[circuit.part]]
what = "the output pin out"
symbol = "opin"
with = { lab = "out" }

