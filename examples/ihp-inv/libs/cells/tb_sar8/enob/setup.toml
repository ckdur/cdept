# Dynamic performance of the behavioural 8-bit SAR ADC (cells/sar8): 128 conversions at
# 1 MS/s of a coherent sine (11 cycles in 128 samples, 0.58 V amplitude around vref/2:
# 97 % of full scale). The code is read once per conversion at 950 ns (after the LSB's
# latch closed at 885 ns) with sample(), and the 128 codes go through the FFT with a
# rectangular window (coherent sampling needs none). An ideal 8-bit quantiser gives
# SNDR 49.9 dB, ENOB 8.0. msb_err is the relative error of the MSB weight: sweep it
# (view msb_sweep) to see ENOB drop. Run it with
#   cdept sim run cells tb_sar8 --view enob
corners = ["tt"]
save = ["v(in)", "v(code)", "v(xadc.hold)", "v(xadc.dac)"]

[variables]
vref = "1.2"
ampl = "0.58"
fin = "85.9375k"
msb_err = "0"

[[analysis]]
kind = "tran"
step = "1n"
stop = "128.5u"

[[output]]
name = "enob"
expr = 'enob(sample(v("code"), 1u, from=950n), window="rect")'

[[output]]
name = "sndr_db"
expr = 'sndr(sample(v("code"), 1u, from=950n), window="rect")'

[[output]]
name = "sfdr_db"
expr = 'sfdr(sample(v("code"), 1u, from=950n), window="rect")'

[[output]]
name = "code_span"
expr = 'pkpk(sample(v("code"), 1u, from=950n))'

[[spec]]
name = "enob"
min = 7.8

[[spec]]
name = "sndr_db"
min = 48.0
