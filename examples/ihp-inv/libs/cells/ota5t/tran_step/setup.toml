# Unity-gain step response of the OTA (out tied to inn): a 200 mV step on inp at 10 ns,
# 0.32 V to 0.52 V, into 100 fF. Settling to 1 % of the step, overshoot and the final
# error (finite gain and offset). From the test template startup_settle (docs/TESTS.md).
# Run it with
#   cdept sim run cells ota5t --view tran_step
template = "startup_settle"
schematic = "cells/tb_ota5t_step"
corners = ["tt", "ff", "ss", "fs", "sf"]
temperatures = [-40, 27, 125]

[template_args]
out = "out"
t_step = "10n"
step = "20p"
stop = "60n"
tol = "0.01"
target = "0.52"
settle_max = "20n"
overshoot_max = 15
final_err_max = "25m"

[variables]
vdd = "1.2"
vlo = "0.32"
vhi = "0.52"
ibias = "20u"
cl = "100f"
ac_vdd = "0"
