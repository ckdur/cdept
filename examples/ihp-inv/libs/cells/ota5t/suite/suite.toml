# The OTA's family of tests over five process corners and three temperatures (15 points
# per test, 90 runs): open-loop gain, unity-gain frequency and phase margin, unity-gain
# step settling, operating point with every transistor saturated, power, PSRR and CMRR.
# Run it with
#   cdept sim suite cells ota5t
# or open the view in the Simulation tab (Run suite).
description = "IHP SG13G2 5-transistor OTA: AC, step, operating point, power, PSRR, CMRR"
corners = ["tt", "ff", "ss", "fs", "sf"]
temperatures = [-40, 27, 125]

[[test]]
view = "ac_open"
[[test]]
view = "tran_step"
[[test]]
view = "dc_op"
[[test]]
view = "power"
[[test]]
view = "psrr"
[[test]]
view = "cmrr"

# PSRR and CMRR from the open-loop gain of the same run point (corner and temperature)
# rather than the fixed adm_db of the psrr/cmrr views: computed after all tests ran.
[[combine]]
test = "psrr"
name = "psrr_point_db"
expr = "ac_open.gain_db - psrr.xfer_db"
min = 50
[[combine]]
test = "cmrr"
name = "cmrr_point_db"
expr = "ac_open.gain_db - cmrr.xfer_db"
# 39.4 dB at sf, 125 C (the gain there is 32 dB, not the 36 dB the cmrr view assumes)
min = 38
