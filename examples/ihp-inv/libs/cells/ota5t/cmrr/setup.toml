# Common-mode rejection of the OTA: the open-loop testbench with the AC stimulus on the
# common-mode source Vcm, which moves inp and (through Vin and Cin) inn together
# (ac_cm = 1, the differential AC off). cm_gain_db is out/cm at 1 kHz and
# rejection_db = adm_db - cm_gain_db, adm_db the typical open-loop gain from ac_open.
# From the test template psrr_cmrr (docs/TESTS.md). Run it with
#   cdept sim run cells ota5t --view cmrr
template = "psrr_cmrr"
schematic = "cells/tb_ota5t"
corners = ["tt", "ff", "ss", "fs", "sf"]
temperatures = [-40, 27, 125]

[template_args]
mode = "cmrr"
stim = "cm"
out = "out"
f = "1k"
adm_db = 36
rejection_min = 40

[variables]
vdd = "1.2"
vcm = "0.42"
ibias = "20u"
cl = "100f"
ac_dm = "0"
ac_cm = "1"
ac_vdd = "0"
