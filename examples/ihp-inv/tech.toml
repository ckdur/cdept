# CDePT technology snapshot of the PDK "ihp-sg13g2": what CDePT read out of the PDK's
# files when this project was set up for it. It says where each tool's set-up is
# (KLayout technology and decks, xschemrc, magicrc, netgen set-up), which model files
# and corners there are, and which libraries the PDK brings.
#
# Paths starting with $PDK_ROOT follow the PDK folder of each machine (cdept.local.toml
# or the environment). The long lists (layers, PCells, symbols, cells) are next to
# this file in tech.catalog.json.
#
# Made by `cdept init --technology ihp-sg13g2`; made again by `cdept tech refresh`, which
# replaces the whole file. To change a setting for good, set it in cdept.toml: what is
# written there wins over this file.

schema = "cdept-tech"
version = 1
notes = [
    "devices: 2 device(s) netlist as a model no model library defines (inductor, inductor3)",
    "libraries: the PDK has two libraries named 'sg13g2_pr'; a project lists $PDK_ROOT/ihp-sg13g2/libs.tech/xschem/sg13g2_pr and not $PDK_ROOT/ihp-sg13g2/libs.ref/sg13g2_pr (a library cannot have several folders yet)",
]

[pdk]
name = "ihp-sg13g2"
family = "ihp-sg13g2"
version = "unreleased (2026-09-01)"
commit = "cb743f75aabc96e30450e9e53afc8d3c4867e5e2"
source = "git"
description = "IHP SG13G2 130 nm SiGe BiCMOS"
tools = [
    "digital",
    "gdsfactory",
    "gnucap",
    "klayout",
    "librelane",
    "magic",
    "netgen",
    "ngspice",
    "openems",
    "openroad",
    "palace",
    "parasitics",
    "qucs-s",
    "verilog-a",
    "xschem",
    "xyce",
]
branch = "dev"

[pdk.tested_with]
klayout = "0.30.5"
magic = "8.3.589"
ngspice = "43"
openems = "v0.0.35-108-gc651cce"
openvaf = "23.5.0"
python = "3.10.12"
qucs-s = "s25.2.0"
xschem = "3.4.8RC"
xyce = "7.8-opensource"

[klayout]
path = ["$PDK_ROOT/ihp-sg13g2/libs.tech/klayout"]
tech = "sg13g2"
description = "IHP SiGe 130nm technology"
lyt = "$PDK_ROOT/ihp-sg13g2/libs.tech/klayout/tech/sg13g2.lyt"
base_path = "$PDK_ROOT/ihp-sg13g2/libs.tech/klayout/tech"
layer_properties = "$PDK_ROOT/ihp-sg13g2/libs.tech/klayout/tech/sg13g2.lyp"
dbu = 0.001
grids = [10.0, 5.0, 1.0, 0.5, 0.1, 0.05, 0.01, 0.005]
default_grid = 0.005
layer_maps = ["$PDK_ROOT/ihp-sg13g2/libs.tech/klayout/tech/sg13g2.map"]
connectivity = [
    "GatPoly,Cont,Metal1",
    "Diff,Cont,Metal1",
    "Metal1,Via1,Metal2",
    "Metal2,Via2,Metal3",
    "Metal3,Via3,Metal4",
    "Metal4,Via4,Metal5",
    "Metal5,TopVia1,TopMetal1",
    "TopMetal1,TopVia2,TopMetal2",
]
pcell_libraries = ["SG13_dev", "SG13_native_pcell_lib"]
d25 = ["$PDK_ROOT/ihp-sg13g2/libs.tech/klayout/tech/d25/sg13g2_beol.lyd25"]
xsection = ["$PDK_ROOT/ihp-sg13g2/libs.tech/klayout/tech/xsect/sg13g2_for_EM.xs"]

[[klayout.drc]]
name = "ihp-sg13g2"
file = "$PDK_ROOT/ihp-sg13g2/libs.tech/klayout/tech/drc/ihp-sg13g2.drc"
form = "script"

[[klayout.lvs]]
name = "sg13g2"
file = "$PDK_ROOT/ihp-sg13g2/libs.tech/klayout/tech/lvs/sg13g2.lvs"
form = "script"

[magic]
rc = "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc"
tech = "ihp-sg13g2"
tech_file = "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.tech"
version = "1.0.1"
description = "IHP SG13G2: Open Source rules and DRC"
requires = "magic-8.3.617"
includes = [
    "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/ihp-sg13g2-cifout.tech",
    "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/ihp-sg13g2-cifin.tech",
    "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/ihp-sg13g2-drc.tech",
    "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/ihp-sg13g2-extract.tech",
]
tcl = "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.tcl"
scale = "10 nanometers"
settings = ["drc euclidean on", "ext2spice scale off"]
cifoutput = ["gdsii", "drc", "density", "patternfill", "patternfill(tiled)"]
cifinput = ["sg13g2"]
extract = [
    "ngspice",
    "ngspice(lvs)",
    "ngspice(hrhc)",
    "ngspice(lrhc)",
    "ngspice(hrlc)",
    "ngspice(lrlc)",
]
drc = ["drc(fast)", "drc(full)", "drc(routing)"]

[magic.globals]
GND = "VSS"
SUB = "sub!"
VDD = "VDD"

[[magic.scripts]]
role = "density"
file = "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/check_density.py"

[[magic.scripts]]
role = "fill"
file = "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/generate_fill.py"

[[magic.scripts]]
role = "seal-ring"
file = "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/generate_seal.py"

[[magic.scripts]]
role = "gds-tech"
file = "$PDK_ROOT/ihp-sg13g2/libs.tech/magic/ihp-sg13g2-GDS.tech"

[netgen]
setup = "$PDK_ROOT/ihp-sg13g2/libs.tech/netgen/ihp-sg13g2_setup.tcl"
environment = ["NETGEN_COLUMNS"]

[xschem]
rc = "$PDK_ROOT/ihp-sg13g2/libs.tech/xschem/xschemrc"
evaluated = true
start_window = "$PDK_ROOT/ihp-sg13g2/libs.tech/xschem/start_page.sch"
netlist_dir = "$PWD/simulations"
library_path = [
    "$PDK_ROOT/ihp-sg13g2/libs.tech/xschem",
    "$PDK_ROOT/ihp-sg13g2/libs.tech/xschem/sg13g2_pr",
    "$PDK_ROOT/ihp-sg13g2/libs.ref/sg13g2_stdcell/sym/xschem",
]
tcl_files = [
    "$PDK_ROOT/ihp-sg13g2/libs.tech/xschem/sg13g2_pr/cap_cmomi.tcl",
    "$PDK_ROOT/ihp-sg13g2/libs.tech/xschem/xschem-drc",
    "$PDK_ROOT/ihp-sg13g2/libs.tech/xschem/xschem-menu",
    "$XSCHEM_SHAREDIR/ngspice_backannotate.tcl",
]

[xschem.variables]
MODELS_NGSPICE = "$PDK_ROOT/ihp-sg13g2/libs.tech/ngspice/models"
