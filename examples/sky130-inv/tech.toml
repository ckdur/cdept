file = "$PDK_ROOT/sky130A/libs.tech/klayout/macros/run_drc_full.lydrc"
form = "macro"

[[klayout.lvs]]
name = "sky130"
file = "$PDK_ROOT/sky130A/libs.tech/klayout/lvs/sky130.lvs"
form = "script"

[[klayout.lvs]]
name = "sky130"
file = "$PDK_ROOT/sky130A/libs.tech/klayout/lvs/sky130.lylvs"
form = "macro"

