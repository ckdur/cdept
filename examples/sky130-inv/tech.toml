# CDePT technology snapshot of the PDK "sky130A": what CDePT read out of the PDK's
# files when this project was set up for it. It says where each tool's set-up is
# (KLayout technology and decks, xschemrc, magicrc, netgen set-up), which model files
# and corners there are, and which libraries the PDK brings.
#
# Paths starting with $PDK_ROOT follow the PDK folder of each machine (cdept.local.toml
# or the environment). The long lists (layers, PCells, symbols, cells) are next to
# this file in tech.catalog.json.
#
# Made by `cdept init --technology sky130A`. This file is read as it is: edit it by hand
# (the files of a library, a corner, ...) and the edit applies. `cdept tech refresh`
# makes it again from the PDK and replaces the whole file (the old one is kept as
# tech.toml.bak). What cdept.toml sets wins over this file.

schema = "cdept-tech"
version = 1
notes = [
    "KLayout: the technology's LEF/DEF reader names merged.lef, which is not in $PDK_ROOT/sky130A/libs.tech/klayout/tech",
    "KLayout: 18 PCells read out of the PDK's Python sources (KLayout was not started); defaults that are expressions are kept as written",
    "xschem: the xschemrc was read as text, not evaluated (the scan read files only): conditions and computed values are not followed",
    "refs: the openlane configuration names libraries that are not installed: sky130_fd_sc_hdll, sky130_fd_sc_hs, sky130_fd_sc_ls, sky130_fd_sc_ms, sky130_osu_sc_t18",
    "devices: CDePT ships no device map for sky130A; 45 of 75 devices were matched to KLayout PCells by guessing. Write the draft with `cdept tech devices`, check it, and name it in [klayout] devices",
    "libraries: the PDK has two libraries named 'sky130_fd_pr'; a project lists $PDK_ROOT/sky130A/libs.tech/xschem/sky130_fd_pr and not $PDK_ROOT/sky130A/libs.ref/sky130_fd_pr (a library cannot have several folders yet)",
]

[pdk]
name = "sky130A"
family = "sky130"
version = "1.0.530"
commit = "8afc8346a57fe1ab7934ba5a6056ea8b43078e71"
source = "ciel"
description = "Skywater 0.13um CMOS, local interconnect + high-resistance poly + 5 metal layer backend stack + MiM caps + redistribution layer 1"
tools = [
    "combined",
    "irsim",
    "klayout",
    "magic",
    "netgen",
    "ngspice",
    "openlane",
    "qflow",
    "xcircuit",
    "xschem",
]

[pdk.tested_with]
magic = "8.3.525"

[klayout]
path = ["$PDK_ROOT/sky130A/libs.tech/klayout"]
tech = "sky130"
description = "SkyWater 130nm technology"
lyt = "$PDK_ROOT/sky130A/libs.tech/klayout/tech/sky130A.lyt"
base_path = "$PDK_ROOT/sky130A/libs.tech/klayout/tech"
layer_properties = "$PDK_ROOT/sky130A/libs.tech/klayout/tech/sky130A.lyp"
dbu = 0.001
grids = [0.01, 0.005]
default_grid = 0.005
layer_maps = ["$PDK_ROOT/sky130A/libs.tech/klayout/tech/sky130A.map"]
connectivity = [
    "poly,licon,li",
    "li,mcon,met1",
    "met1,via1,met2",
    "met2,via2,met3",
    "met3,via3,met4",
    "met4,via4,met5",
]
pcell_libraries = ["skywater130"]
d25 = ["$PDK_ROOT/sky130A/libs.tech/klayout/d25/sky130.lyd25"]
xsection = ["$PDK_ROOT/sky130A/libs.tech/klayout/tech/xsect/sky130.xs"]

[[klayout.drc]]
name = "sky130A_mr"
file = "$PDK_ROOT/sky130A/libs.tech/klayout/drc/sky130A_mr.drc"
form = "script"

[[klayout.drc]]
name = "sky130A"
file = "$PDK_ROOT/sky130A/libs.tech/klayout/drc/sky130A.lydrc"
form = "macro"

[[klayout.drc]]
