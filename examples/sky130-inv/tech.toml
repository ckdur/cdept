file = "$PDK_ROOT/sky130A/libs.tech/magic/run_standard_drc.py"

[[magic.scripts]]
role = "seal-ring"
file = "$PDK_ROOT/sky130A/libs.tech/magic/seal_ring_generator"

[[magic.scripts]]
role = "bind-keys"
file = "$PDK_ROOT/sky130A/libs.tech/magic/sky130A-BindKeys"

[[magic.scripts]]
