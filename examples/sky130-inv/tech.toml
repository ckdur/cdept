[magic]
rc = "$PDK_ROOT/sky130A/libs.tech/magic/sky130A.magicrc"
tech = "sky130A"
tech_file = "$PDK_ROOT/sky130A/libs.tech/magic/sky130A.tech"
version = "1.0.530-0-g8afc834"
description = "SkyWater SKY130: Open Source rules and DRC"
requires = "magic-8.3.411"
tcl = "$PDK_ROOT/sky130A/libs.tech/magic/sky130A.tcl"
scale = "10 nanometers"
settings = ["drc euclidean on", "ext2spice scale off", "snap lambda"]
cell_paths = [
    "$PDK_ROOT/sky130A/libs.ref/sky130_fd_pr/mag",
    "$PDK_ROOT/sky130A/libs.ref/sky130_fd_io/mag",
    "$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/mag",
    "$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hvl/mag",
    "$PDK_ROOT/sky130A/libs.ref/sky130_ml_xx_hd/mag",
    "$PDK_ROOT/sky130A/libs.ref/sky130_sram_macros/mag",
]
cifoutput = ["gdsii", "gdsii(origfill)", "drc", "density", "wafflefill", "wafflefill(tiled)"]
cifinput = ["sky130", "sky130(vendor)", "rdlimport"]
extract = [
    "ngspice",
    "ngspice(orig)",
    "ngspice(si)",
    "ngspice(hrhc)",
    "ngspice(lrhc)",
    "ngspice(hrlc)",
    "ngspice(lrlc)",
]
drc = ["drc(fast)", "drc(full)", "drc(routing)"]

[magic.globals]
