# CDePT device map for Magic in sky130A (docs/MAGIC.md, "Layout from schematic"):
# which device generator of the PDK's Magic set-up (sky130A.tcl, `magic::gencell
# <library>::<device>`) an xschem symbol of sky130_fd_pr becomes. Same format as the
# KLayout map (docs/LINKING.md §3): `library` is the Tcl namespace of the generators,
# `cell` the device, `params` the generator's parameters. sky130's xschem symbols give
# W and L in µm without a unit, which is what the generators take.
format = "cdept-devices"
version = 1

[[device]]
symbol = "sky130_fd_pr/nfet_01v8.sym"
library = "sky130"
cell = "sky130_fd_pr__nfet_01v8"
params = { w = "@W", l = "@L", nf = "@nf", m = "@mult" }

